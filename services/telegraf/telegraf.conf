# AeroNorth UNS — Telegraf configuration (Module 3)
# Subscribes to all informative telemetry and persists to TimescaleDB.
# Redis LKV output is deferred to Module 7.

[agent]
  interval        = "5s"
  flush_interval  = "5s"
  omit_hostname   = true
  precision       = "1ms"

# ── MQTT consumer ──────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers   = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  username  = "${MQTT_USER}"
  password  = "${MQTT_PASSWORD}"
  client_id = "telegraf-uns"

  # All informative signals: <ent>/<site>/<area>/<line>/<cell>/measure/<signal>
  topics = ["+/+/+/+/+/measure/#"]

  data_format = "json_v2"

  # Parse ISA-95 topic segments into individual tags.
  # mqtt_consumer also auto-injects the full MQTT path as the "topic" tag.
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/+/+/+/+/measure/+"
    tags  = "enterprise/site/area/line/cell/_/signal_name"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "metrics"

    # Payload schema: {"val": <float>, "ts": <epoch_ms>, "q": <int>}
    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "val"
      type   = "float"
      rename = "value"

    [[inputs.mqtt_consumer.json_v2.field]]
      path   = "q"
      type   = "int"
      rename = "quality"

# ── TimescaleDB output via outputs.postgresql ──────────────────────────────────
# The metrics hypertable is pre-created by services/timescaledb/init/01-metrics.sql:
#   metrics(time TIMESTAMPTZ, topic TEXT, value DOUBLE PRECISION, quality SMALLINT)
#
# outputs.postgresql uses the measurement name ("metrics") as the table name.
# It inserts: timestamp → "time", remaining tags → columns, fields → columns.
#
# We keep only the "topic" tag (full MQTT path) and drop all ISA-95 breakdown
# tags. The "value" and "quality" fields map directly to the table columns.
[[outputs.postgresql]]
  connection = "host=${TIMESCALE_HOST} port=5432 user=${TIMESCALE_USER} password=${TIMESCALE_PASSWORD} dbname=${TIMESCALE_DB} sslmode=disable"

  # Drop ISA-95 breakdown tags — we only want the full "topic" tag in the table.
  tagexclude = ["enterprise", "site", "area", "line", "cell", "signal_name"]

  # Timestamp column maps to time TIMESTAMPTZ in the hypertable.
  timestamp_column_name = "time"
  timestamp_column_type = "timestamp with time zone"

  # The table already exists as a hypertable — disable auto-creation.
  # Setting create_templates to empty prevents CREATE TABLE attempts.
  create_templates      = []
  add_column_templates  = []

  # Keep tags flat (no JSON, no foreign-key tag table).
  tags_as_foreign_keys = false
  tags_as_jsonb        = false
  fields_as_jsonb      = false
