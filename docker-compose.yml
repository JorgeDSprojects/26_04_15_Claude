name: aeronorth-uns

services:
  mqtt-broker:
    image: emqx/emqx:5.8.3
    container_name: aeronorth-mqtt-broker
    restart: unless-stopped
    environment:
      EMQX_NAME: aeronorth-emqx
      EMQX_HOST: 127.0.0.1
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public123}
      EMQX_RETAINER__BACKEND__STORAGE_TYPE: disc
    ports:
      - "1883:1883"
      - "1884:1883"
      - "18083:18083"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    networks:
      - uns-network
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  simulator:
    build: ./services/simulator
    container_name: aeronorth-simulator
    restart: unless-stopped
    environment:
      MQTT_HOST: mqtt-broker
      MQTT_PORT: 1883
      MQTT_USER: ${MQTT_USER:-testuser}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-testpass}
      SIM_INTERVAL_MS: ${SIM_INTERVAL_MS:-10000}
      SIM_ASSET_PATH: ${SIM_ASSET_PATH:-aeronorth/windfarm_north/sector_a/turbine_03}
    networks:
      - uns-network
    depends_on:
      mqtt-broker:
        condition: service_healthy

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: aeronorth-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TIMESCALE_USER:-postgres}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-tspass}
      POSTGRES_DB: ${TIMESCALE_DB:-metrics}
    ports:
      - "5433:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./services/timescaledb/init:/docker-entrypoint-initdb.d
    networks:
      - uns-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-postgres} -d ${TIMESCALE_DB:-metrics}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  telegraf:
    image: telegraf:1.33
    container_name: aeronorth-telegraf
    restart: unless-stopped
    volumes:
      - ./services/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      MQTT_HOST: mqtt-broker
      MQTT_PORT: 1883
      MQTT_USER: ${MQTT_USER:-testuser}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-testpass}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_USER: ${TIMESCALE_USER:-postgres}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-tspass}
      TIMESCALE_DB: ${TIMESCALE_DB:-metrics}
    networks:
      - uns-network
    depends_on:
      mqtt-broker:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

networks:
  uns-network:
    name: uns-network
    driver: bridge

volumes:
  emqx-data:
  emqx-log:
  timescaledb-data:
